<section id="education" class="section-padding bg-gray-50 dark:bg-gray-800/50">
      <div class="container-custom">
        <div class="text-center mb-16">
          <h2 class="section-title text-4xl lg:text-5xl font-display font-bold text-gray-900 dark:text-white mb-6">
            <span class="text-gradient">Education</span>
          </h2>
          <p class="section-subtitle text-xl text-gray-600 dark:text-gray-300 max-w-3xl mx-auto">
            My academic foundation that shaped my technical expertise and problem-solving skills
          </p>
        </div>

        <div class="grid md:grid-cols-2 gap-8 max-w-4xl mx-auto">
          <div 
            *ngFor="let edu of education; let i = index" 
            class="education-card group">
            
            <div class="card p-8 h-full relative overflow-hidden">
              <!-- Background Pattern -->
              <div class="absolute top-0 right-0 w-32 h-32 opacity-5 group-hover:opacity-10 transition-opacity duration-300">
                <svg class="w-full h-full" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M10.496 2.132a1 1 0 00-.992 0l-7 4A1 1 0 003 8v7a1 1 0 100 2h14a1 1 0 100-2V8a1 1 0 00.496-1.868l-7-4zM6 9a1 1 0 00-1 1v3a1 1 0 001 1h3a1 1 0 001-1v-3a1 1 0 00-1-1H6zM6 5a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1z" clip-rule="evenodd" />
                </svg>
              </div>

              <!-- Content -->
              <div class="relative z-10">
                <!-- Duration -->
                <div class="mb-4">
                  <span class="px-3 py-1 bg-primary-100 dark:bg-primary-900 text-primary-700 dark:text-primary-300 rounded-full text-sm font-medium">
                    {{ edu.startDate }} - {{ edu.endDate }}
                  </span>
                </div>

                <!-- Degree & Institution -->
                <div class="mb-6">
                  <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">
                    {{ edu.degree }}
                  </h3>
                  <h4 class="text-lg font-semibold text-primary-600 dark:text-primary-400 mb-2">
                    {{ edu.institution }}
                  </h4>
                  <p *ngIf="edu.field" class="text-gray-600 dark:text-gray-300 mb-2">
                    {{ edu.field }}
                  </p>
                  <p *ngIf="edu.location" class="text-gray-500 dark:text-gray-400 text-sm">
                    <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    {{ edu.location }}
                  </p>
                </div>

                <!-- GPA -->
                <div *ngIf="edu.gpa" class="mb-6">
                  <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-300">GPA</span>
                    <span class="text-lg font-bold text-secondary-600 dark:text-secondary-400">{{ edu.gpa }}/4.0</span>
                  </div>
                  <div class="w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
                    <div 
                      class="bg-gradient-to-r from-secondary-500 to-secondary-600 h-2 rounded-full transition-all duration-1000"
                      [style.width.%]="(parseFloat(edu.gpa) / 4.0) * 100">
                    </div>
                  </div>
                </div>

                <!-- Description -->
                <div *ngIf="edu.description" class="text-gray-600 dark:text-gray-300 leading-relaxed">
                  {{ edu.description }}
                </div>

                <!-- Icon -->
                <div class="absolute bottom-4 right-4 opacity-20 group-hover:opacity-40 transition-opacity duration-300">
                  <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12v4.102a8.969 8.969 0 00-1.05-.174 1 1 0 01-.89-.89 11.115 11.115 0 01.25-3.762zM9.3 16.573A9.026 9.026 0 007 14.935v-3.957l1.818.78a3 3 0 002.364 0l5.508-2.361a11.026 11.026 0 01.25 3.762 1 1 0 01-.89.89 8.968 8.968 0 00-5.35 2.524 1 1 0 01-1.4 0zM6 18a1 1 0 001-1v-2.065a8.935 8.935 0 00-2-.712V17a1 1 0 001 1z" />
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
