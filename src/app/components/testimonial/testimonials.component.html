<section id="testimonials" class="section-padding bg-white dark:bg-gray-900">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
        <div class="container-custom">
            <div class="text-center mb-16">
                <h2 class="section-title text-4xl lg:text-5xl font-display font-bold text-gray-900 dark:text-white mb-6">Proof of <span class="text-gradient">Impact</span></h2>
                <p class="section-subtitle text-xl text-gray-600 dark:text-gray-300 max-w-3xl mx-auto">What my clients say about working with me and the results we've achieved together</p>
            </div>
            <!-- Grid: show 3 visible at a time (wraps around) -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <ng-container *ngFor="let idx of visibleIndices()">
                <div class="relative card rounded-xl p-3 md:p-5">
                    <div class="relative z-10" style="height: 375px; display: flex;align-content: space-between;flex-direction: column;justify-content: space-between;">
                        <blockquote class="review-clamp text-gray-700 dark:text-gray-300 leading-relaxed mb-4">"{{ testimonials[idx]?.content }}"</blockquote>
                        <div class="flex items-center">
                            <img [src]="testimonials[idx]?.avatar" (error)="setFallback($event)" [alt]="testimonials[idx]?.name" class="w-16 h-16 rounded-full object-cover mr-4"/>
                            <div>
                                <h4 class="text-lg font-semibold text-gray-900 dark:text-white">{{ testimonials[idx]?.name }}</h4>
                                <p class="text-gray-600 dark:text-gray-400 italic">{{ testimonials[idx]?.role }} at {{ testimonials[idx]?.company }}</p>
                            </div>
                        </div>
                    </div>
                </div>
                </ng-container>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-between mt-8">
                <button (click)="goToPrevious()" class="p-3 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700" aria-label="Previous">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 18l-6-6 6-6"></path>
                    </svg>
                </button>

                <!-- Dots (each dot jumps to make that item the leftmost) -->
                <div class="flex space-x-2">
                    <button *ngFor="let t of testimonials; let i = index" (click)="goToSlide(i)" [ngClass]="i === currentIndex ? 'bg-blue-600 dark:bg-blue-400' : 'bg-gray-300 dark:bg-gray-600 hover:bg-gray-400 dark:hover:bg-gray-500'" class="w-3 h-3 rounded-full transition-colors" [attr.aria-label]="'Go to testimonial ' + (i + 1)"></button>
                </div>

                <button (click)="goToNext()" class="p-3 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700" aria-label="Next">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</section>
